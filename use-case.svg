<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="780" fill="#ffffff"/>

  <!-- Межі системи -->
  <rect x="230" y="30" width="540" height="715" fill="none" stroke="#000" stroke-width="2"/>
  <text x="500" y="55" font-size="16" font-weight="bold" text-anchor="middle">Система управління послугами хімчистки</text>

  <!-- Зв'язки акторів з варіантами використання -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <line x1="132" y1="240" x2="370" y2="100"/>
    <line x1="132" y1="240" x2="370" y2="185"/>
    <line x1="132" y1="240" x2="370" y2="270"/>
    <line x1="132" y1="240" x2="370" y2="355"/>
    <line x1="132" y1="240" x2="370" y2="440"/>
    <line x1="132" y1="240" x2="370" y2="525"/>
    <line x1="132" y1="520" x2="370" y2="610"/>
    <line x1="132" y1="520" x2="370" y2="695"/>
  </g>

  <!-- Узагальнення: Адміністратор успадковує можливості Приймальника -->
  <line x1="110" y1="464" x2="110" y2="324" stroke="#000" stroke-width="1.5"/>
  <polygon points="110,312 104,324 116,324" fill="#fff" stroke="#000" stroke-width="1.5"/>

  <!-- Актор: Приймальник -->
  <g stroke="#000" stroke-width="2" fill="none">
    <circle cx="110" cy="198" r="12"/>
    <line x1="110" y1="210" x2="110" y2="252"/>
    <line x1="88" y1="225" x2="132" y2="225"/>
    <line x1="110" y1="252" x2="90" y2="280"/>
    <line x1="110" y1="252" x2="130" y2="280"/>
  </g>
  <text x="110" y="305" font-size="14" font-weight="bold" text-anchor="middle">Приймальник</text>

  <!-- Актор: Адміністратор -->
  <g stroke="#000" stroke-width="2" fill="none">
    <circle cx="110" cy="478" r="12"/>
    <line x1="110" y1="490" x2="110" y2="532"/>
    <line x1="88" y1="505" x2="132" y2="505"/>
    <line x1="110" y1="532" x2="90" y2="560"/>
    <line x1="110" y1="532" x2="130" y2="560"/>
  </g>
  <text x="110" y="585" font-size="14" font-weight="bold" text-anchor="middle">Адміністратор</text>

  <!-- Варіанти використання -->
  <g stroke="#000" stroke-width="1.5" fill="#f4f8ff">
    <ellipse cx="500" cy="100" rx="130" ry="30"/>
    <ellipse cx="500" cy="185" rx="130" ry="30"/>
    <ellipse cx="500" cy="270" rx="130" ry="30"/>
    <ellipse cx="500" cy="355" rx="130" ry="30"/>
    <ellipse cx="500" cy="440" rx="130" ry="30"/>
    <ellipse cx="500" cy="525" rx="130" ry="30"/>
    <ellipse cx="500" cy="610" rx="130" ry="30"/>
    <ellipse cx="500" cy="695" rx="130" ry="30"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#000">
    <text x="500" y="105">Керувати клієнтами</text>
    <text x="500" y="190">Оформити замовлення</text>
    <text x="500" y="275">Змінити статус замовлення</text>
    <text x="500" y="360">Скасувати замовлення</text>
    <text x="500" y="445">Видати замовлення</text>
    <text x="500" y="520">Пошук і фільтрація</text>
    <text x="500" y="536">замовлень</text>
    <text x="500" y="605">Перегляд прострочених</text>
    <text x="500" y="621">замовлень</text>
    <text x="500" y="700">Керувати прайс-листом</text>
  </g>
</svg>
